[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nanohat"
version = "2.1.0"
description = "NanoHat: Autonomous Sub-1B Fedora Linux OS Agent powered by SmolLM2-360M"
readme = "README.md"
authors = [
    { name = "Asim Ibn Akhlaque" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.2.0",
    "transformers>=4.48.0",
    "accelerate>=0.28.0",
]

[project.scripts]
nanohat = "runtime.agent:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["runtime*", "generator*", "validator*"]
